[project]
name = "dra-boundary-free-eval"
version = "0.1.0"
description = "Task-boundary-free evaluation for a simulated pushing task (Dean's Research Award project)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned exactly: results that depend on the physics should not shift under us.
    "mujoco==3.15.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The experiment code lives in src/boundary_free and is installed into the environment,
# so scripts and tests can `import boundary_free` from anywhere in the project.
packages = ["src/boundary_free"]
